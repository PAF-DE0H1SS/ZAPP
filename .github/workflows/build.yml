name: ZAPP Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # QA-линтер репозитория (tools/zapp-lint): локальные файлы не в индексе,
      # манифест согласован с классами, namespace'ы не конфликтуют, Str-ключи
      # биективны, версии в порядке.
      - name: Lint repo
        run: go run ./tools/zapp-lint .
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest
        working-directory: APP

      # Нативные демоны (wg/box/openvpn/tor/…) в git не входят (~300 МБ):
      # лежат отдельным релизом native-bins. Без них APK собирается,
      # но без VPN/Zapret/Tor.
      - name: Fetch native daemons
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/native-bins/native-jniLibs.tar.gz"
          if curl -fsSL --retry 3 "$url" -o /tmp/native-jniLibs.tar.gz; then
            mkdir -p APP/app/src/main/jniLibs
            tar -xzf /tmp/native-jniLibs.tar.gz -C APP/app/src/main/jniLibs
          fi

      # Подпись release-APK секретами репозитория; без них сборка уходит
      # неподписанной, и такой APK в релиз не попадает.
      - name: Prepare release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p APP/signing
            echo "$KS_B64" | base64 -d > APP/signing/zapp.keystore
            printf 'storeFile=signing/zapp.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > APP/signing/keystore.properties
          fi

      - run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        working-directory: APP
      - uses: actions/upload-artifact@v4
        with:
          name: zapp-android-apks
          path: APP/app/build/outputs/apk/**/*.apk

  windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageMsi
        working-directory: APP
      - uses: actions/upload-artifact@v4
        with:
          name: zapp-windows-msi
          path: APP/desktopApp/build/compose/binaries/main/msi/*.msi

  linux:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageAppImage
        working-directory: APP
      - uses: actions/upload-artifact@v4
        with:
          name: zapp-linux-appimage
          path: APP/desktopApp/build/compose/binaries/main/appimage/*.AppImage

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # В релиз идут production-артефакты: подписанные APK (не debug и не
      # unsigned), MSI и AppImage. Пустой набор -- релиз не создаём.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( \
            -name '*.msi' -o -name '*.AppImage' -o \
            \( -name 'ZAPP-*.apk' ! -name '*-debug*' ! -name '*unsigned*' \) \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Нет production-артефактов - релиз не создаём" >&2
            exit 1
          fi
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZAPP $TAG_NAME" \
            --notes "Android APK, Windows MSI, Linux AppImage." \
            "${files[@]}"
