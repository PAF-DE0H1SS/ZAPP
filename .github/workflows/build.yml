name: ZAPP auto-build (Android + Windows/Linux desktop)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Проект лежит в APP/, потому что в корне репозитория ещё лежат docs/ и
  # служебные файлы. Все gradle-задачи отсюда.
  PROJECT_DIR: APP

jobs:
  android:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # JDK 21: его требует gradle-daemon-jvm.properties, и в нём же есть
      # jpackage, который нужен десктопным джобам ниже.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Unit tests
        working-directory: APP
        run: ./gradlew :composeApp:desktopTest

      # Подпись release-APK. Секреты задаются владельцем репозитория
      # (gh secret set); без них сборка идёт без signingConfigs и выдаёт
      # app-release-unsigned.apk -- такой в релиз не публикуется.
      - name: Prepare release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Секреты keystore не заданы -- release-сборка будет неподписанной"
            exit 0
          fi
          mkdir -p APP/signing
          echo "$KS_B64" | base64 -d > APP/signing/zapp.keystore
          printf 'storeFile=signing/zapp.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > APP/signing/keystore.properties
          echo "keystore раскладан, release будет подписан"

      # Нативные демоны (wg/box/openvpn/tor/lyrebird/nfqws/goodbyedpi) в git
      # не входят: ~300 МБ против лимита GitHub в 100 МБ. Они лежат отдельным
      # релизом native-bins; без них APK собирается, но без VPN/Zapret/Tor
      # и в релиз не публикуется (проверка libbox.so в release-job).
      - name: Fetch native daemons
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/native-bins/native-jniLibs.tar.gz"
          if curl -fsSL --retry 3 "$url" -o /tmp/native-jniLibs.tar.gz; then
            tar -xzf /tmp/native-jniLibs.tar.gz -C APP/app/src/main/jniLibs
            echo "распаковано .so: $(find APP/app/src/main/jniLibs -name '*.so' | wc -l)"
          else
            echo "релиз native-bins не найден -- собираем без нативных демонов"
          fi

      - name: Build Android
        working-directory: APP
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zapp-android-apks
          path: |
            APP/app/build/outputs/apk/debug/app-debug.apk
            APP/app/build/outputs/apk/release/*.apk

  windows:
    name: Windows 10/11 MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Windows MSI
        working-directory: APP
        run: ./gradlew :desktopApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zapp-windows-msi
          path: APP/desktopApp/build/compose/binaries/main/msi/*.msi

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Сырой jpackage .deb в CI не собирается вообще: без scripts/finish-deb.sh
      # в нём нет Depends, симлинка, .desktop и иконки, а публиковать его в таком
      # виде нельзя. .deb остаётся для локальной сборки (build-all.sh).
      - name: Build AppImage package
        working-directory: APP
        run: ./gradlew :desktopApp:packageAppImage

      - name: Package real AppImage (appimagetool)
        run: |
          set -euxo pipefail
          curl -fsSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APP_DIR=APP/desktopApp/build/compose/binaries/main/app
          SRC=$APP_DIR/zapp
          AD=/tmp/zapp-appdir
          rm -rf "$AD"
          mkdir -p "$AD"
          cp -r "$SRC/bin" "$AD/bin"
          cp -r "$SRC/lib" "$AD/lib"
          cp "$SRC/lib/zapp.png" "$AD/zapp.png"
          cat > "$AD/zapp.desktop" <<'EOF'
          [Desktop Entry]
          Name=ZAPP
          Comment=Local network toolkit (Compose Multiplatform)
          Exec=zapp
          Icon=zapp
          Type=Application
          Categories=Network;
          Terminal=false
          EOF
          cat > "$AD/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/bin/zapp" "$@"
          EOF
          chmod +x "$AD/AppRun" "$AD/bin/zapp"
          APP_VERSION=$(sed -n 's/.*<app-version>\([^<]*\)<\/app-version>.*/\1/p' "$SRC/lib/app/.jpackage.xml")
          export ARCH=x86_64
          /tmp/appimagetool --appimage-extract-and-run "$AD" "$APP_DIR/zapp-$APP_VERSION.AppImage"
          ls -la "$APP_DIR"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zapp-linux-packages
          path: APP/desktopApp/build/compose/binaries/main/app/*.AppImage

  release:
    name: GitHub Release (tags v*)
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Install gh
        run: |
          command -v gh || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # APK сюда НЕ попадает: в CI keystore нет (signing/ в .gitignore,
          # подпись -- только локально через signing/keystore.properties),
          # поэтому android-джоб отдаёт неподписанные debug/unsigned. Публикуется
          # только production-сборка, загруженная владельцем через
          # `gh release upload`. Неподписанный APK в релиз не выкладываем.
          mapfile -d '' files < <(find artifacts -type f \( -name '*.msi' -o -name '*.AppImage' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Нет ни одного production-артефакта - релиз не создаём" >&2
            exit 1
          fi
          # Подписанный production APK идёт к релизу вместе с десктопными
          # образами. upload-artifact сохраняет структуру каталогов
          # (release/app-release.apk), поэтому ищем рекурсивно. CI-сборка
          # пока без native/ (jniLibs в .gitignore, ~300 МБ) и не содержит
          # демонов -- такой APK в релиз не добавляем: признак полной сборки
          # -- libbox.so в архиве.
          apk=$(find artifacts -type f -name 'app-release.apk' | head -1 || true)
          if [ -n "$apk" ] && unzip -l "$apk" | grep -q 'libbox\.so'; then
            cp "$apk" "zapp-$TAG_NAME.apk"
            files+=("zapp-$TAG_NAME.apk")
          else
            echo "CI-APK без нативных демонов -- в релиз не добавляем"
          fi
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZAPP $TAG_NAME" \
            --notes "Autogenerated by CI. Desktop artifacts: Windows MSI, Linux AppImage. Android APK прикладывается отдельно - подписанная production-сборка." \
            "${files[@]}"
