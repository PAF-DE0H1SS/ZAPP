org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Сборку вариантов НЕ распараллеливаем. AGP пишет и подписывает APK через
# ForkJoinPool.commonPool() (zipflinger + apksig), а пул один на весь
# демон. При параллельном запуске нескольких package<Variant> их записывающие
# потоки занимают весь пул, ожидая мониторы своих архивов, и подпись V2,
# которая ждёт задачу из того же пула, виснет вместе с ними -- сборка
# останавливается на packageRootRelease без единой строки вывода и не
# завершается никогда. Локально воспроизводилось стабильно; одиночная
# упаковка пяти сплитов того же варианта укладывается в 35 секунд.
org.gradle.parallel=false

# Версия приложения в одном месте: APK (app/build.gradle.kts) и дистрибутивы
# desktopApp (packageVersion) берут её отсюда, чтобы не расходились.
zappVersion=2.7.0