org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Гонки не в задачах, а ВНУТРИ package<Variant> -- отсюда и оба флага.
#
# При сплитах по ABI AGP запускает по одному IncrementalSplitterRunnable на
# каждый ABI через workerExecutor.noIsolation(), то есть пять упаковщиков
# работают одновременно внутри одной задачи. Каждый пишет записи APK через
# ForkJoinPool.commonPool() (ApkFlinger.writeFile), а при закрытии архива
# подпись V2 шлёт в тот же пул ровно parallelism задач подсчёта дайджеста
# и ждёт ВСЕ сразу (IncrementalPackagerBuilder.lambda$withSigning$0).
#
# Отсюда чистое голодание общего пула: упаковщик №1 дошёл до подписи и ждёт,
# пока освободятся все воркеры, а воркеры заняты записями упаковщиков №2-5,
# которые ждут мониторы своих архивов. Сборка останавливается на
# packageRootRelease без единой строки вывода и не завершается никогда.
#
# org.gradle.workers.max=1 сериализует сами сплиты внутри задачи: в момент
# подписи в общем пуле никого не остаётся, голодания нет. Проверено тремя
# чистыми циклами упаковки по 20 APK.
#
# org.gradle.parallel=false на эту гонку НЕ действует -- он сериализует
# задачи, а конкуренция живёт внутри одной. Оставлен, чтобы не гонять разные
# проекты одновременно.
org.gradle.parallel=false
org.gradle.workers.max=1

# Версия приложения в одном месте: APK (app/build.gradle.kts) и дистрибутивы
# desktopApp (packageVersion) берут её отсюда, чтобы не расходились.
zappVersion=2.7.9